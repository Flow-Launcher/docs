name: Link Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.md"
  pull_request:
    paths:
      - "**.md"

jobs:
  link-check:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline blocks network requests so only internal links are checked.
          # --root-dir is needed for docsify's root-relative links such as /plugin-dev.md
          args: --offline --root-dir "$(pwd)" --include-fragments --no-progress './**/*.md'
          fail: true
          jobSummary: true
